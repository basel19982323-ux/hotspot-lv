[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspot-lv"
version = "0.2.0"
description = "Thermal ageing & dynamic loading study of a secondary-substation transformer under electrification (simulation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Basel Haijar", email = "basel19982323@gmail.com" }]
dependencies = [
    "pandapower>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]          # pypdf: the tests read the station-card PDF back
app = ["PySide6-Essentials>=6.7", "pyqtgraph>=0.13"]
build = ["pyinstaller>=6.16"]          # the Windows build: packaging/hotspot-lv.spec

[project.urls]
Source = "https://github.com/basel19982323-ux/hotspot-lv"     # README.txt of the Windows build reads it from here

[project.scripts]
hotspot-lv = "hotspotlv.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotspotlv = ["data/*.csv", "data/*.csv.gz", "data/*.md", "data/*.png", "data/examples/*.csv", "data/examples/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

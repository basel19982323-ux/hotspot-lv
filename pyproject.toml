[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspot-lv"
version = "0.1.0"
description = "Thermal ageing & dynamic loading study of a secondary-substation transformer under electrification (simulation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Basel Haijar", email = "basel19982323@gmail.com" }]
dependencies = [
    "pandapower>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
